<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070b12">
<link rel="icon" type="image/png" href="__FAVICON__">
<title>GIECKO Terminal</title>
<style>
__XTERM_CSS__
:root {
  --gg-bg: #070b12;
  --gg-bar: #0b111c;
  --gg-card: #101827;
  --gg-line: #1e2b42;
  --gg-text: #eaf1fb;
  --gg-dim: #8fa1bd;
  --gg-green: #3ddc84;
  --gg-cyan: #38d6f5;
  --gg-red: #f85149;
  --gg-amber: #fbbf24;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--gg-bg);
  color: var(--gg-text);
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#gg-app {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
#gg-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  background: linear-gradient(180deg, #101a2b 0%, var(--gg-bar) 100%);
  border-bottom: 1px solid var(--gg-line);
  flex: 0 0 auto;
  z-index: 5;
}
#gg-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
#gg-dot {
  width: 16px;
  height: 16px;
  border-radius: 8px;
  background: radial-gradient(circle at 35% 35%, #7bf0ad 0%, #3ddc84 45%, #16522e 100%);
  box-shadow: 0 0 10px #3ddc8488;
  flex: 0 0 auto;
}
#gg-brand {
  color: var(--gg-green);
  font-weight: 800;
  font-size: 14px;
  letter-spacing: 2.5px;
  white-space: nowrap;
}
#gg-title {
  color: var(--gg-dim);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1 1 auto;
  min-width: 0;
}
#gg-status {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--gg-line);
  color: var(--gg-dim);
  white-space: nowrap;
  flex: 0 0 auto;
}
#gg-status.live { color: var(--gg-green); border-color: #3ddc8466; background: #3ddc8418; }
#gg-status.warn { color: var(--gg-amber); border-color: #fbbf2466; background: #fbbf2418; }
#gg-status.dead { color: var(--gg-red); border-color: #f8514966; background: #f8514918; }
.gg-btn {
  background: var(--gg-card);
  color: var(--gg-dim);
  border: 1px solid var(--gg-line);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  min-width: 30px;
  height: 30px;
  padding: 0 8px;
  cursor: pointer;
  flex: 0 0 auto;
  user-select: none;
}
.gg-btn:active { background: #1a2740; color: var(--gg-text); }
#gg-term-wrap {
  flex: 1 1 auto;
  min-height: 0;
  padding: 4px 2px;
  position: relative;
}
#gg-term { height: 100%; }
#gg-term .terminal { height: 100%; }
#gg-keys {
  display: none;
  flex: 0 0 auto;
  flex-direction: column;
  background: var(--gg-bar);
  border-top: 1px solid var(--gg-line);
}
#gg-keys.show { display: flex; }
.gg-keys-row {
  display: flex;
  gap: 6px;
  padding: 6px 8px 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.gg-keys-row:last-child { padding-bottom: 6px; }
.gg-keys-row::-webkit-scrollbar { display: none; }
.gg-key {
  background: var(--gg-card);
  color: var(--gg-text);
  border: 1px solid var(--gg-line);
  border-radius: 10px;
  min-width: 40px;
  height: 42px;
  padding: 0 11px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
}
.gg-key:active { background: #22355a; }
.gg-key.on { border-color: var(--gg-green); color: var(--gg-green); background: #3ddc8422; }
#gg-overlay {
  position: fixed;
  inset: 0;
  background: rgba(7, 11, 18, 0.86);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 20;
  backdrop-filter: blur(3px);
}
#gg-overlay.show { display: flex; }
#gg-card {
  background: var(--gg-card);
  border: 1px solid var(--gg-line);
  border-radius: 16px;
  padding: 26px 34px;
  text-align: center;
  box-shadow: 0 0 40px #3ddc8422;
}
#gg-card h1 { color: var(--gg-green); font-size: 20px; letter-spacing: 4px; margin: 0 0 6px 0; }
#gg-card p { color: var(--gg-dim); font-size: 13px; margin: 4px 0; }
#gg-card button {
  margin-top: 14px;
  background: var(--gg-green);
  color: #04110a;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 800;
  padding: 10px 22px;
  cursor: pointer;
}
</style>
</head>
<body>
<div id="gg-app">
  <div id="gg-bar">
    <div id="gg-logo">
      <div id="gg-dot"></div>
      <span id="gg-brand">GIECKO</span>
    </div>
    <span id="gg-title">terminal</span>
    <span id="gg-status">CONNECTING</span>
    <button class="gg-btn" id="gg-font-minus" title="smaller text">A-</button>
    <button class="gg-btn" id="gg-font-plus" title="bigger text">A+</button>
    <button class="gg-btn" id="gg-toggle-keys" title="extra keys">KEYS</button>
    <button class="gg-btn" id="gg-full" title="fullscreen">[ ]</button>
  </div>
  <div id="gg-term-wrap"><div id="gg-term"></div></div>
  <div id="gg-keys">
    <div class="gg-keys-row">
      <div class="gg-key" data-code="esc">Esc</div>
      <div class="gg-key" data-code="ctrlc">^C</div>
      <div class="gg-key" data-mod="ctrl">Ctrl</div>
      <div class="gg-key" data-mod="alt">Alt</div>
      <div class="gg-key" data-code="tab">Tab</div>
      <div class="gg-key" data-code="up">↑</div>
      <div class="gg-key" data-code="down">↓</div>
      <div class="gg-key" data-code="left">←</div>
      <div class="gg-key" data-code="right">→</div>
      <div class="gg-key" data-code="home">Home</div>
      <div class="gg-key" data-code="end">End</div>
      <div class="gg-key" data-code="pgup">PgUp</div>
      <div class="gg-key" data-code="pgdn">PgDn</div>
      <div class="gg-key" data-code="del">Del</div>
      <div class="gg-key" data-paste="1">Paste</div>
      <div class="gg-key" data-keyboard="1">Keyboard</div>
    </div>
    <div class="gg-keys-row gg-syms">
      <div class="gg-key" data-sym="|">|</div>
      <div class="gg-key" data-sym="/">/</div>
      <div class="gg-key" data-sym="\">\</div>
      <div class="gg-key" data-sym="~">~</div>
      <div class="gg-key" data-sym="`">`</div>
      <div class="gg-key" data-sym="^">^</div>
      <div class="gg-key" data-sym="&lt;">&lt;</div>
      <div class="gg-key" data-sym="&gt;">&gt;</div>
      <div class="gg-key" data-sym="[">[</div>
      <div class="gg-key" data-sym="]">]</div>
      <div class="gg-key" data-sym="{">{</div>
      <div class="gg-key" data-sym="}">}</div>
      <div class="gg-key" data-sym="(">(</div>
      <div class="gg-key" data-sym=")">)</div>
      <div class="gg-key" data-sym="=">=</div>
      <div class="gg-key" data-sym="+">+</div>
      <div class="gg-key" data-sym="-">-</div>
      <div class="gg-key" data-sym="_">_</div>
      <div class="gg-key" data-sym=":">:</div>
      <div class="gg-key" data-sym=";">;</div>
      <div class="gg-key" data-sym="&quot;">&quot;</div>
      <div class="gg-key" data-sym="'">'</div>
      <div class="gg-key" data-sym="*">*</div>
      <div class="gg-key" data-sym="&amp;">&amp;</div>
      <div class="gg-key" data-sym="#">#</div>
      <div class="gg-key" data-sym="%">%</div>
      <div class="gg-key" data-sym="$">$</div>
      <div class="gg-key" data-sym="@">@</div>
      <div class="gg-key" data-sym="!">!</div>
      <div class="gg-key" data-sym="?">?</div>
    </div>
  </div>
</div>
<div id="gg-overlay">
  <div id="gg-card">
    <h1>GIECKO</h1>
    <p id="gg-overlay-text">connection lost, reconnecting...</p>
    <button id="gg-reconnect">Reconnect now</button>
  </div>
</div>
<script>
__XTERM_JS__
</script>
<script>

</script>
<script>

</script>
<script>

</script>
<script>
__ADDON_CLIPBOARD__
</script>
<script>
(function () {
  var prefs = { fontSize: 15, fontFamily: '"JetBrains Mono", "Fira Code", Menlo, Consolas, monospace', theme: { background: '#0B0F14', foreground: '#E6EDF3', cursor: '#FFB454', selection: '#1E3A5F' }, titleFixed: '' };
  var fontSize = 15;
  try { fontSize = parseInt(localStorage.getItem('gg-font') || '15', 10) || 15; } catch (e) {}
  prefs.fontSize = fontSize;

  var term = new Terminal({
    cursorBlink: true,
    allowProposedApi: true,
    fontSize: prefs.fontSize,
    fontFamily: prefs.fontFamily,
    theme: prefs.theme,
    scrollback: 5000,
    convertEol: false
  });
  var fit = new FitAddon.FitAddon();
  var webLinks = new WebLinksAddon.WebLinksAddon();
  term.loadAddon(fit);
  term.loadAddon(webLinks);
  if (window.Unicode11Addon) {
    try { term.loadAddon(new Unicode11Addon.Unicode11Addon()); term.unicode.activeVersion = '11'; } catch (e) {}
  }
  term.open(document.getElementById('gg-term'));
  if (window.ClipboardAddon) {
    try { term.loadAddon(new ClipboardAddon.ClipboardAddon()); } catch (e) {}
  }
  try { fit.fit(); } catch (e) {}

  var statusEl = document.getElementById('gg-status');
  var titleEl = document.getElementById('gg-title');
  var overlay = document.getElementById('gg-overlay');
  var overlayText = document.getElementById('gg-overlay-text');
  var keysBar = document.getElementById('gg-keys');
  try {
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) keysBar.classList.add('show');
  } catch (e) {}
  var socket = null;
  var authenticated = false;
  var backoff = 1000;

  function setStatus(cls, text) {
    statusEl.className = cls;
    statusEl.textContent = text;
  }

  function send(data) {
    if (socket && socket.readyState === 1) {
      socket.send(new TextEncoder().encode('0' + data));
    }
  }

  function sendResize() {
    if (socket && socket.readyState === 1 && term.cols && term.rows) {
      socket.send(new TextEncoder().encode('1' + JSON.stringify({ columns: term.cols, rows: term.rows })));
    }
  }

  function applyPrefs(p) {
    if (!p) return;
    if (p.fontSize) { fontSize = parseInt(p.fontSize, 10) || fontSize; term.options.fontSize = fontSize; }
    if (p.fontFamily) { term.options.fontFamily = p.fontFamily; }
    if (p.titleFixed) { titleEl.textContent = p.titleFixed; }
    if (p.theme) {
      var t = term.options.theme || {};
      var keys = ['background', 'foreground', 'cursor', 'cursorAccent', 'selection', 'black', 'red', 'green', 'yellow', 'blue', 'magenta', 'cyan', 'white'];
      for (var i = 0; i < keys.length; i++) {
        if (p.theme[keys[i]]) t[keys[i]] = p.theme[keys[i]];
      }
      term.options.theme = t;
    }
    try { fit.fit(); sendResize(); } catch (e) {}
  }

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    try {
      socket = new WebSocket(proto + location.host + '/ws', ['tty']);
    } catch (e) {
      setStatus('dead', 'NO WEBSOCKET');
      return;
    }
    socket.binaryType = 'arraybuffer';
    setStatus('warn', 'CONNECTING');

    socket.onopen = function () {
      var init = { columns: term.cols, rows: term.rows };
      if (authenticated) init.AuthToken = window.ggToken;
      socket.send(new TextEncoder().encode(JSON.stringify(init)));
      setStatus('live', 'LIVE');
      overlay.classList.remove('show');
      backoff = 1000;
      try { fit.fit(); sendResize(); } catch (e) {}
    };

    socket.onmessage = function (ev) {
      var data = ev.data;
      if (typeof data === 'string') return;
      var bytes = new Uint8Array(data);
      if (bytes.length === 0) return;
      var opcode = String.fromCharCode(bytes[0]);
      var payload = new TextDecoder().decode(bytes.subarray(1));
      if (opcode === '0') {
        term.write(payload);
      } else if (opcode === '1') {
        document.title = payload + ' - GIECKO';
        if (!prefs.titleFixed) titleEl.textContent = payload;
      } else if (opcode === '2') {
        try { applyPrefs(JSON.parse(payload)); } catch (e) {}
      }
    };

    socket.onclose = function () {
      setStatus('dead', 'DISCONNECTED');
      overlayText.textContent = 'connection lost, reconnecting in ' + Math.round(backoff / 1000) + 's...';
      overlay.classList.add('show');
      setTimeout(function () {
        if (backoff < 15000) backoff = backoff * 1.6;
        connect();
      }, backoff);
    };

    socket.onerror = function () {};
  }

  fetch('token', { credentials: 'same-origin' }).then(function (r) {
    if (!r.ok) throw new Error('no token');
    return r.json();
  }).then(function (j) {
    window.ggToken = j.token;
    authenticated = true;
  }).catch(function () {
    authenticated = false;
  }).then(function () {
    connect();
  });

  var stickyCtrl = false;
  var stickyAlt = false;

  function updateMods() {
    var c = keysBar.querySelector('.gg-key[data-mod="ctrl"]');
    var a = keysBar.querySelector('.gg-key[data-mod="alt"]');
    if (c) c.classList.toggle('on', stickyCtrl);
    if (a) a.classList.toggle('on', stickyAlt);
  }

  term.onData(function (d) {
    if (stickyCtrl || stickyAlt) {
      var out = d;
      if (stickyCtrl) {
        if (d.length === 1) {
          if (d === ' ') {
            out = '\x00';
          } else {
            var c = d.toUpperCase().charCodeAt(0);
            if (c >= 64 && c <= 95) out = String.fromCharCode(c & 31);
          }
        } else if (d.length > 1 && d.charAt(0) === '\x1b') {
          out = d.replace(/\[([A-DHF])/, '[1;5$1');
        }
      }
      if (stickyAlt && out.charAt(0) !== '\x1b') out = '\x1b' + out;
      stickyCtrl = false;
      stickyAlt = false;
      updateMods();
      send(out);
      return;
    }
    send(d);
  });

  term.onResize(function () {
    sendResize();
  });

  window.addEventListener('resize', function () {
    try { fit.fit(); sendResize(); } catch (e) {}
  });

  function refit() {
    try { fit.fit(); sendResize(); } catch (e) {}
  }

  if (window.ResizeObserver) {
    var rafPending = false;
    var ro = new ResizeObserver(function () {
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(function () {
        rafPending = false;
        refit();
      });
    });
    ro.observe(document.getElementById('gg-term-wrap'));
  }

  document.getElementById('gg-font-plus').addEventListener('click', function () {
    fontSize = Math.min(28, fontSize + 1);
    term.options.fontSize = fontSize;
    try { localStorage.setItem('gg-font', String(fontSize)); } catch (e) {}
    try { fit.fit(); sendResize(); } catch (e) {}
  });

  document.getElementById('gg-font-minus').addEventListener('click', function () {
    fontSize = Math.max(8, fontSize - 1);
    term.options.fontSize = fontSize;
    try { localStorage.setItem('gg-font', String(fontSize)); } catch (e) {}
    try { fit.fit(); sendResize(); } catch (e) {}
  });

  document.getElementById('gg-full').addEventListener('click', function () {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen();
    }
  });

  document.getElementById('gg-toggle-keys').addEventListener('click', function () {
    keysBar.classList.toggle('show');
    refit();
  });

  document.getElementById('gg-reconnect').addEventListener('click', function () {
    backoff = 1000;
    if (socket) { try { socket.close(); } catch (e) {} }
    connect();
  });

  keysBar.addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('.gg-key') : null;
    if (!el) return;
    var mod = el.getAttribute('data-mod');
    if (mod === 'ctrl') { stickyCtrl = !stickyCtrl; updateMods(); return; }
    if (mod === 'alt') { stickyAlt = !stickyAlt; updateMods(); return; }
    if (el.getAttribute('data-keyboard')) { term.focus(); return; }
    if (el.getAttribute('data-paste')) {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function (t) { if (t) send(t); }).catch(function () {});
      }
      return;
    }
    var sym = el.getAttribute('data-sym');
    if (sym) {
      var out = sym;
      if (stickyCtrl) {
        var c = sym.toUpperCase().charCodeAt(0);
        if (c >= 64 && c <= 95) out = String.fromCharCode(c & 31);
      }
      if (stickyAlt) out = '\x1b' + out;
      if (stickyCtrl || stickyAlt) { stickyCtrl = false; stickyAlt = false; updateMods(); }
      send(out);
      return;
    }
    var code = el.getAttribute('data-code');
    var seqs = {
      esc: '\x1b', tab: '\t', ctrlc: '\x03',
      up: '\x1b[A', down: '\x1b[B', left: '\x1b[D', right: '\x1b[C',
      home: '\x1b[H', end: '\x1b[F', pgup: '\x1b[5~', pgdn: '\x1b[6~', del: '\x1b[3~'
    };
    if (code && seqs[code]) {
      var seq = seqs[code];
      if (stickyCtrl) {
        var m = { up: '\x1b[1;5A', down: '\x1b[1;5B', left: '\x1b[1;5D', right: '\x1b[1;5C', home: '\x1b[1;5H', end: '\x1b[1;5F' };
        if (m[code]) seq = m[code];
      }
      if (stickyAlt) seq = '\x1b' + seq;
      stickyCtrl = false;
      stickyAlt = false;
      updateMods();
      send(seq);
    }
  });

  term.focus();
})();
</script>
</body>
</html>
