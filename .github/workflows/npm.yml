name: npm publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (latest or next)'
        required: false
        default: 'latest'
      confirm:
        description: 'Type PUBLISH to publish the giecko npm package (test on gecko-test first)'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  publish:
    if: github.event.inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: build and check
        run: |
          npm ci
          npm run build
          npm run check
        working-directory: cli

      - name: pack preview
        run: |
          npm pack --dry-run
        working-directory: cli

      - name: publish
        run: npm publish --access public --tag '${{ inputs.tag }}'
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
